releaseNotes: |
  Arranca el cifrado de extremo a extremo en Nube y deja armar los equipos del próximo mes antes de que empiece la rotación.
  
  Cifrado de extremo a extremo en Nube: notas, labs, indicaciones y monitoreo ahora se guardan cifrados. El servidor deja de poder leerlos.
  
  Equipos de la próxima rotación: R4/Admin arma y publica los equipos del mes siguiente antes de que empiece, con vínculo al equipo que reemplazan para heredar pacientes.
  
  Autounión anticipada: un residente puede ver y unirse a su equipo de la próxima rotación desde ya, sin esperar a que R4 lo asigne.
  
  Vista previa de traspaso: la tarjeta del equipo nuevo muestra qué pacientes tiene ahora mismo el equipo que va a reemplazar.
  
  Corrección: el selector "Hereda pacientes de" en Mis equipos ya no mostraba solo "Ninguno" — ahora lista toda la sala.

name = "rplus-sync"
main = "src/index.js"
compatibility_date = "2026-06-01"

[[durable_objects.bindings]]
name = "ROOM_SYNC_HUB"
class_name = "RoomSyncHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomSyncHub"]

[[d1_databases]]
binding = "DB"
database_name = "rplus-sync"
database_id = "e8e36134-36a9-40d4-9c36-3f893e2b612c"
migrations_dir = "schema"

[assets]
directory = "../sync-pages/public"
binding = "ASSETS"

[triggers]
crons = ["0 6 * * *"]

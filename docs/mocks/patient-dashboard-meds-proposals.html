<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>R+ · medicamentos · lista SOAP</title>
  <style>
    :root {
      --color-paper: #0c0e14;
      --color-surface: #14161e;
      --color-content: #0c0e14;
      --color-elevated: #1c1e26;
      --color-ink: #f5f5f7;
      --color-ink-muted: #98989d;
      --color-accent: #6eb6ff;
      --color-danger: #ff453a;
      --border: rgba(148, 163, 184, 0.16);
      --divider: rgba(148, 163, 184, 0.09);
      --radius-container: 12px;
      --radius-chip: 8px;
      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 13.5px/1.4 var(--font-ui);
      color: var(--color-ink);
      background: var(--color-paper);
      display: flex;
      flex-direction: column;
    }
    button { font: inherit; color: inherit; cursor: pointer; }

    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      height: 44px; padding: 0 14px; flex-shrink: 0;
      background: var(--color-surface);
      border-bottom: 1px solid var(--divider);
    }
    .brand { font-weight: 700; letter-spacing: -0.02em; }
    .hint { color: var(--color-ink-muted); font-size: 12px; }
    .switcher {
      display: flex; gap: 3px; padding: 3px;
      background: var(--color-content);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .switcher button {
      border: 0; background: transparent; padding: 6px 11px;
      border-radius: 8px; font-weight: 600; font-size: 12px;
      color: var(--color-ink-muted);
    }
    .switcher button[aria-pressed="true"] {
      background: var(--color-elevated); color: var(--color-ink);
    }
    .switcher button:active { transform: scale(0.97); }

    .shell {
      flex: 1; min-height: 0; display: grid;
      grid-template-columns: 228px 1fr;
      gap: 6px; padding: 6px;
    }
    .sidebar, .main {
      background: var(--color-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-container);
      min-height: 0; display: flex; flex-direction: column;
    }
    .side-h {
      padding: 12px 14px 8px;
      font-size: 11px; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; color: var(--color-ink-muted);
    }
    .pcard {
      display: block; width: calc(100% - 16px); margin: 0 8px 4px;
      text-align: left; border: 1px solid transparent; background: transparent;
      border-radius: 10px; padding: 8px 10px;
    }
    .pcard b { display: block; font-size: 12.5px; }
    .pcard span { color: var(--color-ink-muted); font-size: 11.5px; }
    .pcard.is-on { background: var(--color-elevated); border-color: var(--border); }

    .tabs {
      display: flex; gap: 2px; padding: 0 8px; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--color-content);
    }
    .tab {
      border: 0; background: transparent;
      padding: 10px 14px 9px; font-weight: 600; font-size: 13.5px;
      color: var(--color-ink);
      box-shadow: inset 0 -2px 0 var(--color-ink);
    }
    .subtabs {
      display: flex; gap: 6px; padding: 8px 12px; flex-shrink: 0;
      border-bottom: 1px solid var(--divider); min-height: 40px; align-items: center;
    }
    .pill-nav {
      border: 1px solid var(--border);
      background: color-mix(in oklab, var(--color-ink) 8%, var(--color-elevated));
      border-radius: 999px; padding: 5px 12px;
      font-size: 12.5px; font-weight: 600;
    }

    .stage {
      flex: 1; min-height: 0; overflow: hidden;
      padding: clamp(8px, 1.4cqh, 16px);
    }

    .patient-dash {
      container-type: size;
      height: 100%; min-height: 0; overflow: hidden;
      display: flex; flex-direction: column;
      gap: clamp(6px, 1.2cqh, 12px);
      font-size: clamp(11.5px, 1.45cqi, 15px);
    }
    .idrow {
      display: flex; justify-content: space-between; gap: 0.75em;
      align-items: flex-start; flex: 0 0 auto;
    }
    .idrow h1 {
      margin: 0;
      font: 600 0.95em/1.25 var(--font-ui);
      letter-spacing: -0.018em;
    }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .chip {
      background: oklch(0.38 0.06 52); border-radius: var(--radius-chip);
      padding: 3px 8px; font-size: 0.78em; font-weight: 600; color: oklch(0.88 0.08 52);
    }
    .ic-mod { margin-top: 8px; }
    .ic-mod small {
      display: block; font-size: 11px; font-weight: 700;
      color: var(--color-ink-muted); margin-bottom: 4px;
    }
    .svc {
      border: 0; border-radius: var(--radius-chip); padding: 3px 8px;
      font-size: 11.5px; font-weight: 600;
      background: oklch(0.32 0.06 var(--h, 220));
      color: oklch(0.86 0.08 var(--h, 220));
    }
    .svc-add {
      border: 1px solid var(--border); background: transparent;
      color: var(--color-ink-muted); border-radius: var(--radius-chip);
      padding: 3px 8px; font-size: 11.5px; font-weight: 600;
    }
    .btn-sec {
      border: 1px solid color-mix(in oklab, var(--color-ink) 22%, var(--border));
      background: color-mix(in oklab, var(--color-ink) 6%, var(--color-elevated));
      border-radius: 999px; padding: 0.45em 1em; font-weight: 600;
      min-height: 2.4em; font-size: 0.9em;
    }

    .bento {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: clamp(6px, 1cqi, 12px); flex: 0 0 auto;
    }
    .bento .vitals-card, .bento .labs-card { grid-column: 1 / -1; }
    .bento.rest {
      flex: 0 1 auto; min-height: 0; max-height: 36cqh;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .bento.meds-band {
      flex: 1 1 0; min-height: 0;
      grid-template-columns: 1fr;
    }
    .card {
      background: var(--color-elevated);
      border: 0;
      border-radius: 12px; min-height: 0; overflow: hidden;
      display: flex; flex-direction: column;
    }
    button.card { width: 100%; text-align: left; padding: 0; }
    button.card:active { transform: scale(0.995); }
    .bento.rest > .card, .bento.meds-band > .card {
      height: 100%;
    }
    .card-h {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 8px 14px 6px;
      font-size: 12px; font-weight: 650; letter-spacing: -0.01em;
      flex-shrink: 0;
    }
    .bento.meds-band .card-h { padding: 7px 14px 4px; }
    .card-b { padding: 8px 12px 12px; }
    .bento.rest .card-b, .bento.meds-band .card-b {
      flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
    }
    .bento.meds-band .card-b { padding: 2px 6px 10px 10px; }

    .vitals { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
    .vital small { display: block; color: var(--color-ink-muted); font-size: 0.72em; font-weight: 600; }
    .vital b { font: 600 1.15em/1.2 var(--font-mono); }
    .vital.hi b { color: var(--color-danger); }
    .day-draws { display: flex; flex-wrap: wrap; gap: 6px; }
    .draw {
      border: 1px solid var(--border); background: var(--color-content);
      border-radius: 10px; padding: 7px 10px; flex: 1 1 12rem;
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
    }
    .draw time { font: 600 12px/1.2 var(--font-mono); }
    .tipo { font-size: 11px; font-weight: 600; color: var(--color-ink-muted); }
    .abn {
      color: var(--color-danger); font-weight: 650;
      background: color-mix(in oklab, var(--color-danger) 16%, transparent);
      padding: 2px 7px; border-radius: 999px; font: 500 12px/1.3 var(--font-mono);
    }
    .ea-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 0.35em; }
    .ea-kpis div {
      background: color-mix(in oklab, var(--color-ink) 5%, var(--color-content));
      border: 1px solid var(--divider);
      border-radius: 8px; padding: 6px 8px;
    }
    .ea-kpis small { display: block; color: var(--color-ink-muted); font-size: 0.7em; font-weight: 600; }
    .ea-kpis b { font: 600 0.95em/1.3 var(--font-ui); }
    .empty-hint { margin: 0; color: var(--color-ink-muted); font: 500 13px/1.45 var(--font-ui); }

    /* SOAP list — grouped rows, not pills */
    .soap-pack {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      flex: 1; min-height: 0;
      align-content: start;
      align-items: start;
      overflow: hidden;
    }
    .soap-pack section {
      min-width: 0;
      padding: 2px 14px 0;
      border-right: 1px solid var(--divider);
    }
    .soap-pack section:first-child { padding-left: 4px; }
    .soap-pack section:last-child { border-right: 0; padding-right: 8px; }
    .soap-pack .z,
    .soap-pack .z2 {
      display: flex; align-items: baseline; gap: 0.45em;
      font-size: 11px; font-weight: 650; letter-spacing: 0.08em;
      color: var(--color-ink-muted);
      padding: 2px 0 4px;
    }
    .soap-pack .z em,
    .soap-pack .z2 em {
      font: 500 11px/1.2 var(--font-ui);
      letter-spacing: 0; font-style: normal;
      color: color-mix(in oklab, var(--color-ink-muted) 72%, transparent);
    }
    .soap-pack .z2 { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--divider); }
    .soap-pack .med {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 10px;
      padding: 5px 0 6px;
      border-bottom: 1px solid var(--divider);
    }
    .soap-pack .med:last-child { border-bottom: 0; }
    .soap-pack .name {
      font: 590 13px/1.2 var(--font-ui);
      letter-spacing: -0.016em;
      min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .soap-pack .meta {
      flex-shrink: 0;
      font: 500 11.5px/1.2 var(--font-ui);
      letter-spacing: 0.01em;
      color: var(--color-ink-muted);
      font-variant-numeric: tabular-nums;
    }
    .soap-pack .meta.is-key {
      color: var(--color-ink);
      font-weight: 600;
    }

    .now-soap {
      display: flex; gap: 0.6em; flex: 1; min-height: 0;
      align-items: start; justify-content: space-around;
      padding: 4px 8px 8px;
    }
    .now-cat {
      display: flex; flex-direction: column; align-items: center;
      gap: 4px; flex: 1; min-width: 0; text-align: center;
    }
    .now-cat small {
      font-size: 0.62em; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; color: oklch(0.72 0.06 var(--h, 220));
    }
    .now-cat .meds { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
    .now-cat .med {
      display: inline-flex; border-radius: 999px;
      padding: 3px 10px; font: 600 0.88em/1.2 var(--font-ui);
      border: 1px solid oklch(0.5 0.07 var(--h, 220));
      background: oklch(0.34 0.055 var(--h, 220));
      color: oklch(0.9 0.07 var(--h, 220));
      max-width: 100%; justify-content: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .switcher button:active, button.card:active { transform: none; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div><span class="brand">R+</span> <span class="hint" id="fit-note"></span></div>
    <div class="switcher" role="tablist">
      <button type="button" aria-pressed="true" data-panel="a">Lista</button>
      <button type="button" aria-pressed="false" data-panel="dense">Lista densa</button>
      <button type="button" aria-pressed="false" data-panel="now">Hoy</button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="side-h">Fijados</div>
      <button class="pcard is-on" type="button"><b>HIPOLITO MARTINEZ</b><span>Cto. 202 · Cama 5</span></button>
      <button class="pcard" type="button" disabled><b>GARCIA LOPEZ</b><span>Cto. 118 · Cama 2</span></button>
    </aside>
    <section class="main">
      <nav class="tabs"><button class="tab" type="button">Paciente</button></nav>
      <div class="subtabs">
        <button class="pill-nav" type="button">Resumen</button>
      </div>
      <div class="stage">
        <div class="patient-dash">
          <div class="idrow">
            <div>
              <h1>HIPOLITO BENITEZ MARTINEZ</h1>
              <div class="chips">
                <span class="chip">Síndrome coronario agudo tipo IAMCEST</span>
                <span class="chip">Disfunción ventricular izquierda</span>
                <span class="chip">Bloqueo AV Mobitz I persistente</span>
              </div>
              <div class="ic-mod">
                <small>Servicios interconsultantes</small>
                <div class="chips">
                  <span class="svc" style="--h:245">Cardiología</span>
                  <button class="svc-add" type="button">+ Agregar</button>
                </div>
              </div>
            </div>
            <button class="btn-sec" type="button">Actualizar labs</button>
          </div>

          <div class="bento">
            <div class="card vitals-card">
              <div class="card-h">Signos vitales</div>
              <div class="card-b">
                <div class="vitals">
                  <div class="vital"><small>T/A</small><b>98/60</b></div>
                  <div class="vital"><small>FC</small><b>67</b></div>
                  <div class="vital"><small>FR</small><b>19</b></div>
                  <div class="vital hi"><small>Temp</small><b>35.3</b></div>
                  <div class="vital"><small>SatO₂</small><b>99%</b></div>
                  <div class="vital"><small>Glu</small><b>140</b></div>
                  <div class="vital"><small>I/O</small><b>−580</b></div>
                </div>
              </div>
            </div>
            <div class="card labs-card">
              <div class="card-h">Labs: Solo alterados</div>
              <div class="card-b">
                <div class="day-draws">
                  <div class="draw">
                    <time>07:14</time>
                    <span class="tipo">QS</span><span class="abn">1.4*</span><span class="abn">34*</span>
                    <span class="tipo">PFH</span><span class="abn">3.5*</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="bento rest">
            <button class="card" type="button">
              <div class="card-h">Estado clínico</div>
              <div class="card-b">
                <div class="ea-kpis">
                  <div><small>Soporte</small><b>Aire ambiente</b></div>
                  <div><small>Dieta</small><b>Ayuno</b></div>
                </div>
              </div>
            </button>
            <button class="card" type="button">
              <div class="card-h">Eventualidades</div>
              <div class="card-b"><p class="empty-hint">Sin eventualidades</p></div>
            </button>
            <button class="card" type="button">
              <div class="card-h">Pendientes</div>
              <div class="card-b"><p class="empty-hint">Sin pendientes</p></div>
            </button>
          </div>

          <div class="bento meds-band">
            <button class="card meds-card" type="button">
              <div class="card-h">Medicamentos</div>
              <div class="card-b" id="meds-slot"></div>
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Hipólito, as on screen: 8 names, no V, no HI -->
  <template id="tpl-a">
    <div class="soap-pack">
      <section>
        <span class="z">N <em>Neuro</em></span>
        <div class="med"><span class="name">Alprazolam</span></div>
      </section>
      <section>
        <span class="z">HD <em>Hemo</em></span>
        <div class="med"><span class="name">ASA</span></div>
        <div class="med"><span class="name">Ticagrelor</span></div>
        <div class="med"><span class="name">Amlodipino</span></div>
        <div class="med"><span class="name">Telmisartan</span></div>
        <div class="med"><span class="name">Espironolactona</span></div>
        <div class="med"><span class="name">Atorvastatina</span></div>
      </section>
      <section>
        <span class="z">NM <em>Soporte</em></span>
        <div class="med"><span class="name">Rescates de Insulina</span></div>
      </section>
    </div>
  </template>

  <!-- Dense receta from the previous turn -->
  <template id="tpl-dense">
    <div class="soap-pack">
      <section>
        <span class="z">N <em>Neuro</em></span>
        <div class="med"><span class="name">Buprenorfina</span><span class="meta">PRN</span></div>
        <div class="med"><span class="name">Paracetamol</span><span class="meta">PRN</span></div>
        <div class="med"><span class="name">Pregabalina</span></div>
      </section>
      <section>
        <span class="z">HD <em>Hemo</em></span>
        <div class="med"><span class="name">Sacubitrilo Valsartan</span></div>
        <div class="med"><span class="name">Bisoprolol</span></div>
        <div class="med"><span class="name">Enoxaparina</span><span class="meta is-key">c/12 h</span></div>
        <div class="med"><span class="name">Furosemida</span><span class="meta">c/12 h</span></div>
        <div class="med"><span class="name">Espironolactona</span></div>
        <div class="med"><span class="name">Atorvastatina</span></div>
      </section>
      <section>
        <span class="z">HI <em>Infeccioso</em></span>
        <div class="med"><span class="name">Linezolid</span><span class="meta is-key">día 7</span></div>
        <span class="z2">NM <em>Soporte</em></span>
        <div class="med"><span class="name">Plan basal bolo</span><span class="meta">25 UI</span></div>
        <div class="med"><span class="name">Gluconato de Calcio</span><span class="meta">c/6 h</span></div>
      </section>
    </div>
  </template>

  <template id="tpl-now">
    <div class="now-soap">
      <div class="now-cat" style="--h:200"><small>Tromboprofilaxis</small><div class="meds"><span class="med">Acido Acetilsalicilico</span><span class="med">Ticagrelor</span></div></div>
      <div class="now-cat" style="--h:52"><small>NM</small><div class="meds"><span class="med">Rescates de Insulina</span></div></div>
      <div class="now-cat" style="--h:245"><small>Antihipertensivos</small><div class="meds"><span class="med">Amlodipino</span><span class="med">Telmisartan</span></div></div>
      <div class="now-cat" style="--h:230"><small>Sedación / delirium</small><div class="meds"><span class="med">Alprazolam</span></div></div>
      <div class="now-cat" style="--h:200"><small>Diuréticos</small><div class="meds"><span class="med">Espironolactona</span></div></div>
      <div class="now-cat" style="--h:145"><small>Estatinas</small><div class="meds"><span class="med">Atorvastatina</span></div></div>
    </div>
  </template>

  <script>
    var NOTES = {
      a: 'Este paciente. Lista agrupada, no pastillas. Aire bajo N y NM es correcto — no inflar el tipo.',
      dense: 'La receta larga. Mismos renglones; el token a la derecha solo si cambia la ronda.',
      now: 'Lo de la captura: categorías EA centradas, un matiz por cubo, el hueco se ve vacío.'
    };
    var slot = document.getElementById('meds-slot');
    var note = document.getElementById('fit-note');
    function show(id) {
      slot.replaceChildren(document.getElementById('tpl-' + id).content.cloneNode(true));
      note.textContent = NOTES[id];
    }
    show('a');
    document.querySelectorAll('.switcher button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.switcher button').forEach(function (b) {
          b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
        });
        show(btn.dataset.panel);
      });
    });
  </script>
</body>
</html>

<div id="settings-dropdown-backdrop" class="modal-backdrop settings-dropdown-backdrop" aria-hidden="true">
  <div class="modal settings-dropdown settings-dropdown-modal material-glass wb-modal" id="settings-dropdown" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="settings-dropdown-title" tabindex="-1" data-stop-propagation>
    <header class="settings-dropdown-modal-head wb-modal-head">
      <h3 id="settings-dropdown-title" class="wb-modal-title">Ajustes</h3>
      <div class="settings-dropdown-head-links">
        <button type="button" class="settings-head-link" data-onclick="closeSettingsDropdown" data-onclick-2="openLearnHub">Tutoriales</button>
        <button type="button" class="settings-head-link" data-onclick="closeSettingsDropdown" data-onclick-2="openQuickHelp" data-i18n="settings.quickHelp">Ayuda</button>
      </div>
      <button type="button" class="wb-btn wb-btn-ghost wb-btn-icon wb-modal-close" id="btn-settings-dropdown-close" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </header>
    <div class="settings-dropdown-body wb-modal-body" id="settings-dropdown-scroll">
      <div class="settings-search-row">
        <svg class="settings-search-icon" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="settings-search-input" class="settings-search-input" placeholder="Buscar en ajustes…" autocomplete="off" data-oninput="filterSettingsNav" data-oninput-pass="value" aria-label="Buscar en ajustes">
      </div>
      <div id="settings-clinical-sync-mode" class="settings-clinical-sync-mode" hidden>
        <p class="settings-acc-hint settings-clinical-sync-mode-lead">R+ está en modo <strong>solo este equipo</strong> (para médicos ajenos a medicina interna): sin ⇄ LiveSync, Mi rotación ni sala compartida.</p>
        <button type="button" class="wb-btn wb-btn-secondary wb-btn-sm" data-onclick="enableClinicalLanFromSettings">Activar guardia con R+ Cloud…</button>
      </div>

      <div class="settings-accordion-grid">

      <details class="settings-accordion" id="settings-accordion-appearance" data-settings-group="Tú" data-settings-icon="apariencia">
        <summary data-i18n="settings.appearance">Apariencia</summary>
        <div class="settings-acc-body settings-form settings-form--compact" id="settings-appearance-body"></div>
      </details>

      <details class="settings-accordion settings-accordion--full" id="settings-accordion-backup-sync" data-settings-group="Datos" data-settings-icon="respaldos">
        <summary>Respaldos</summary>
        <div class="settings-acc-body" id="settings-backups-body"></div>
      </details>

      <details class="settings-accordion" id="settings-accordion-laboratorio" data-settings-icon="laboratorio">
        <summary>Laboratorio</summary>
        <div class="settings-acc-body" id="settings-lab-body"></div>
      </details>

      <details class="settings-accordion" id="settings-accordion-documents" data-settings-icon="documentos">
        <summary>Documentos</summary>
        <div class="settings-acc-body" id="settings-documents-body"></div>
      </details>

      <details class="settings-accordion" id="settings-accordion-templates" data-settings-icon="plantillas">
        <summary>Plantillas</summary>
        <div class="settings-acc-body" id="settings-templates-body"></div>
      </details>

      <details class="settings-accordion settings-accordion--full" id="settings-accordion-security" data-settings-group="Equipo y app" data-settings-icon="seguridad">
        <summary>Seguridad</summary>
        <div class="settings-acc-body" id="settings-security-body"></div>
      </details>

      <details class="settings-accordion settings-accordion--full" id="settings-accordion-updates" data-settings-icon="aplicacion">
        <summary>Aplicación</summary>
        <div class="settings-acc-body" id="settings-app-body"></div>
      </details>

      <details class="settings-accordion" id="settings-accordion-danger" data-settings-pin="bottom" data-settings-icon="peligro">
        <summary>Zona de peligro</summary>
        <div class="settings-acc-body" id="settings-danger-body"></div>
      </details>
      </div>

      <label for="backup-file-input" class="visually-hidden">Archivo de copia de seguridad JSON</label>
      <input type="file" id="backup-file-input" accept="application/json,.json" aria-label="Archivo de copia de seguridad JSON" style="display:none" data-onchange="onBackupFileChosen" data-onchange-pass="event">
      <label for="patient-backup-file-input" class="visually-hidden">Archivo JSON de respaldo de paciente</label>
      <input type="file" id="patient-backup-file-input" accept="application/json,.json" aria-label="Archivo JSON de respaldo de paciente" style="display:none" data-onchange="onPatientBackupFileChosen" data-onchange-pass="event">
      <label for="range-backup-file-input" class="visually-hidden">Archivo JSON de respaldo por rango</label>
      <input type="file" id="range-backup-file-input" accept="application/json,.json" aria-label="Archivo JSON de respaldo por rango" style="display:none" data-onchange="onRangeBackupFileChosen" data-onchange-pass="event">
      <label for="sync-bundle-file-input" class="visually-hidden">Archivo JSON de paquete de sincronización</label>
      <input type="file" id="sync-bundle-file-input" accept="application/json,.json" aria-label="Archivo JSON de paquete de sincronización" style="display:none" data-onchange="onSyncBundleFileChosen" data-onchange-pass="event">
      <label for="med-catalog-file-input" class="visually-hidden">Archivo JSON de catálogo de medicamentos SOAP</label>
      <input type="file" id="med-catalog-file-input" accept="application/json,.json" aria-label="Archivo JSON de catálogo de medicamentos SOAP" style="display:none" data-onchange="onMedCatalogFileChosen" data-onchange-pass="event">
    </div>
  </div>
</div>
